# Configurando a conex\u00e3o com MongoDB enquanto reposit\u00f3rio de dados
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=pizzaria
# Definindo usu\u00e1rio e senha padr\u00e3o para autentica\u00e7\u00e3o de usu\u00e1rio do sistema
#spring.main.allow-circular-references=true

# Credenciais do usu\u00e1rio administrador inicial (criado apenas se n\u00e3o existir).
# Em produ\u00e7\u00e3o, sobrescreva via vari\u00e1vel de ambiente APP_ADMIN_PASSWORD.
app.admin.username=admin
app.admin.password=${APP_ADMIN_PASSWORD:}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG