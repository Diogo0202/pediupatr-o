<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a href="/pedidos/novo" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Novo pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Cliente</th>
                        <th>Tipo de Pizza</th>
                        <th>Sabor</th>
                        <th>Qtd</th>
                        <th>Total</th>
                        <th>Pagamento</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4">
                            <span th:text="${nomesClientes != null && nomesClientes[pedido.clienteId] != null}
                                          ? ${nomesClientes[pedido.clienteId]} : ${pedido.clienteId}"></span>
                        </td>
                        <td th:text="${pedido.tipoPizza}"></td>
                        <td th:text="${pedido.sabor}"></td>
                        <td th:text="${pedido.quantidade}"></td>
                        <td th:text="${pedido.valorTotal != null}
                                    ? ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')} : '-'"></td>
                        <td th:text="${pedido.metodoPagamento} ?: '-'"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'ENTREGUE'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status}">
                            </span>
                        </td>
                        <td class="text-end pe-4">
                            <!-- Transições permitidas pelo fluxo do pedido -->
                            <div class="d-flex gap-1 justify-content-end align-items-center"
                                 th:with="permitidos=${T(com.umc.pediupatrao.service.PedidoService).proximosStatus(pedido.status)}">
                                <th:block th:if="${!permitidos.isEmpty()}">
                                    <select class="form-select form-select-sm"
                                            style="width:auto"
                                            th:id="'proximo-' + ${pedido.id}">
                                        <option th:each="op : ${permitidos}"
                                                th:value="${op}"
                                                th:text="${op}"></option>
                                    </select>
                                    <button type="button"
                                            class="btn btn-sm btn-outline-primary"
                                            th:onclick="'mudarStatus(\'' + ${pedido.id} + '\')'"
                                            title="Avançar status">
                                        <i class="bi bi-arrow-right-circle-fill"></i>
                                    </button>
                                </th:block>
                                <span th:if="${permitidos.isEmpty()}" class="text-muted small">
                                    Fluxo finalizado
                                </span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

    <script>
        // Avança o pedido para o próximo status permitido pela máquina de estados
        async function mudarStatus(id) {
            const select = document.getElementById('proximo-' + id);
            const novoStatus = select.value;

            try {
                const response = await fetch(`/api/pedidos/${id}/status?status=${encodeURIComponent(novoStatus)}`, {
                    method: 'PUT',
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    location.reload();
                } else {
                    const corpo = await response.json().catch(() => ({}));
                    alert(corpo.erro || 'Não foi possível alterar o status.');
                }
            } catch (e) {
                alert('Erro de comunicação com o servidor.');
            }
        }
    </script>

</div>

</body>
</html>
