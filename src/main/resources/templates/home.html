<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-speedometer2 me-2 text-primary"></i>Dashboard
        </h2>
        <button class="btn btn-outline-secondary btn-sm" onclick="carregarDashboard()">
            <i class="bi bi-arrow-clockwise"></i> Atualizar
        </button>
    </div>

    <!-- ===== Big numbers (KPIs) ===== -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-body">
                    <div class="text-muted small">Faturamento hoje</div>
                    <div class="fs-4 fw-bold text-success" id="kpi-faturamentoDia">R$ 0,00</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-body">
                    <div class="text-muted small">Faturamento do mês</div>
                    <div class="fs-4 fw-bold" id="kpi-faturamentoMes">R$ 0,00</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-body">
                    <div class="text-muted small">Pedidos no mês</div>
                    <div class="fs-4 fw-bold text-primary" id="kpi-pedidosMes">0</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-body">
                    <div class="text-muted small">Ticket médio</div>
                    <div class="fs-4 fw-bold" id="kpi-ticketMedio">R$ 0,00</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-body">
                    <div class="text-muted small">Pedidos em andamento</div>
                    <div class="fs-4 fw-bold text-warning" id="kpi-pedidosAndamento">0</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-body">
                    <div class="text-muted small">Pedidos hoje</div>
                    <div class="fs-4 fw-bold" id="kpi-pedidosDia">0</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-body">
                    <div class="text-muted small">Clientes cadastrados</div>
                    <div class="fs-4 fw-bold" id="kpi-totalClientes">0</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-body">
                    <div class="text-muted small">Pedidos (total)</div>
                    <div class="fs-4 fw-bold" id="kpi-pedidosTotal">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== Gráficos ===== -->
    <div class="row g-3">
        <div class="col-12 col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white fw-semibold">
                    <i class="bi bi-graph-up me-2"></i>Vendas dos últimos 7 dias
                </div>
                <div class="card-body">
                    <canvas id="chartVendas" height="220"></canvas>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white fw-semibold">
                    <i class="bi bi-pie-chart me-2"></i>Sabores mais vendidos
                </div>
                <div class="card-body d-flex justify-content-center">
                    <canvas id="chartSabores" height="220"></canvas>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white fw-semibold">
                    <i class="bi bi-bar-chart me-2"></i>Métodos de pagamento
                </div>
                <div class="card-body">
                    <canvas id="chartPagamentos" height="220"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div id="dashboardErro" class="alert alert-danger mt-3" style="display:none"></div>

    <script th:src="@{/plugins/chart.js/Chart.bundle.min.js}"></script>
    <script>
        const PALETA = ['#0d6efd', '#198754', '#ffc107', '#dc3545', '#6f42c1', '#20c997', '#fd7e14'];
        let graficoVendas = null, graficoSabores = null, graficoPagamentos = null;

        const brl = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        async function carregarDashboard() {
            const erroEl = document.getElementById('dashboardErro');
            erroEl.style.display = 'none';
            try {
                const resp = await fetch('/api/dashboard/stats', { headers: { 'Accept': 'application/json' } });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const s = await resp.json();
                renderizar(s);
            } catch (e) {
                erroEl.textContent = 'Não foi possível carregar os dados do dashboard: ' + e.message;
                erroEl.style.display = 'block';
            }
        }

        function renderizar(s) {
            document.getElementById('kpi-faturamentoDia').textContent = brl(s.faturamentoDia);
            document.getElementById('kpi-faturamentoMes').textContent = brl(s.faturamentoMes);
            document.getElementById('kpi-pedidosMes').textContent = s.pedidosMes;
            document.getElementById('kpi-ticketMedio').textContent = brl(s.ticketMedio);
            document.getElementById('kpi-pedidosDia').textContent = s.pedidosDia;
            document.getElementById('kpi-totalClientes').textContent = s.totalClientes;
            document.getElementById('kpi-pedidosTotal').textContent = s.pedidosTotal;
            document.getElementById('kpi-pedidosAndamento').textContent = s.pedidosAndamento;

            // Gráfico de linha: evolução das vendas (7 dias)
            if (graficoVendas) graficoVendas.destroy();
            graficoVendas = new Chart(document.getElementById('chartVendas'), {
                type: 'line',
                data: {
                    labels: (s.vendas7Dias || []).map(p => p.data),
                    datasets: [{
                        label: 'Faturamento (R$)',
                        data: (s.vendas7Dias || []).map(p => p.total),
                        borderColor: '#0d6efd',
                        backgroundColor: 'rgba(13,110,253,.15)',
                        fill: true,
                        tension: 0.3,
                        lineTension: 0.3
                    }]
                },
                options: {
                    legend: { display: false },
                    scales: {
                        yAxes: [{ ticks: { beginAtZero: true, callback: v => 'R$ ' + v } }]
                    },
                    tooltips: { callbacks: { label: t => ' R$ ' + t.yLabel.toFixed(2) } }
                }
            });

            // Gráfico de rosca: sabores
            const sabores = s.sabores || [];
            if (graficoSabores) graficoSabores.destroy();
            graficoSabores = new Chart(document.getElementById('chartSabores'), {
                type: 'doughnut',
                data: {
                    labels: sabores.map(i => i.sabor),
                    datasets: [{
                        data: sabores.map(i => i.quantidade),
                        backgroundColor: PALETA
                    }]
                },
                options: { legend: { position: 'bottom', labels: { boxWidth: 12, fontSize: 11 } } }
            });

            // Gráfico de barras: métodos de pagamento
            const metodos = s.metodosPagamento || [];
            if (graficoPagamentos) graficoPagamentos.destroy();
            graficoPagamentos = new Chart(document.getElementById('chartPagamentos'), {
                type: 'bar',
                data: {
                    labels: metodos.map(i => i.metodo),
                    datasets: [{
                        label: 'Faturamento (R$)',
                        data: metodos.map(i => i.total),
                        backgroundColor: PALETA
                    }]
                },
                options: {
                    legend: { display: false },
                    scales: { yAxes: [{ ticks: { beginAtZero: true } }] },
                    tooltips: { callbacks: { label: t => ' R$ ' + t.yLabel.toFixed(2) } }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', carregarDashboard);
    </script>

</div>

</body>
</html>
