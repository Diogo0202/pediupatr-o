<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-shield-lock me-2 text-primary"></i>Auditoria
        </h2>
        <span class="badge bg-secondary fs-6" th:text="${#lists.size(logs)} + ' registro(s)'">0</span>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th scope="col" class="ps-4">Data/Hora</th>
                        <th scope="col">Usuário</th>
                        <th scope="col">Ação</th>
                        <th scope="col">Recurso</th>
                        <th scope="col">IP</th>
                        <th scope="col">Status</th>
                        <th scope="col" class="pe-4">Detalhe</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(logs)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum evento registrado.
                        </td>
                    </tr>
                    <tr th:each="log : ${logs}">
                        <td class="ps-4 text-nowrap" th:text="${log.dataHoraFormatada}"></td>
                        <td th:text="${log.usuario}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${log.acao == 'EXCLUSAO'} ? 'bg-danger'
                                    : (${log.acao == 'ALTERACAO'} ? 'bg-warning text-dark'
                                    : (${log.acao == 'CRIACAO'} ? 'bg-success' : 'bg-secondary'))"
                                  th:text="${log.acao}"></span>
                        </td>
                        <td class="text-nowrap" th:text="${log.recurso}"></td>
                        <td class="text-muted" th:text="${log.ip}"></td>
                        <td th:text="${log.status}"></td>
                        <td class="pe-4 small text-muted" th:text="${log.detalhe}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
