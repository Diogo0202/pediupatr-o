<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Cadastro de Usuário - PediuPatrão</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --brand-primary: #ea580c;
            --brand-primary-hover: #c2410c;
            --brand-gradient: linear-gradient(135deg, #ea580c 0%, #f97316 40%, #e11d48 100%);
            --brand-glow: rgba(234, 88, 12, 0.35);
            --bg-deep: #0b0f19;
            --surface-card: rgba(18, 24, 38, 0.9);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(234, 88, 12, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 90% 85%, rgba(225, 29, 72, 0.16) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(30, 41, 59, 0.5) 0%, transparent 70%);
        }

        .ambient-glow {
            position: absolute;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.14) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(70px);
        }

        .signup-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 580px;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .signup-card {
            background: var(--surface-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--surface-border);
            border-radius: 28px;
            padding: 2.75rem 2.5rem;
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                0 0 40px -8px rgba(234, 88, 12, 0.2);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(234, 88, 12, 0.12);
            border: 1px solid rgba(234, 88, 12, 0.3);
            color: #fb923c;
            padding: 0.35rem 0.85rem;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.15rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin-bottom: 0.35rem;
        }

        .brand-title span.accent {
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-label-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.45rem;
        }

        .input-group-custom {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-left {
            position: absolute;
            left: 1rem;
            color: #64748b;
            font-size: 1.15rem;
            pointer-events: none;
            transition: color 0.2s ease;
            z-index: 2;
        }

        .form-control-custom {
            width: 100%;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 0.85rem 1rem 0.85rem 2.85rem;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .form-control-custom::placeholder {
            color: #475569;
        }

        .form-control-custom:focus {
            outline: none;
            background: rgba(15, 23, 42, 0.95);
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.25);
            color: #ffffff;
        }

        .form-control-custom:focus ~ .input-icon-left,
        .input-group-custom:focus-within .input-icon-left {
            color: #fb923c;
        }

        .btn-toggle-password {
            position: absolute;
            right: 0.85rem;
            background: transparent;
            border: none;
            color: #64748b;
            padding: 0.35rem 0.5rem;
            cursor: pointer;
            font-size: 1.15rem;
            transition: color 0.2s ease;
            z-index: 2;
        }

        .btn-toggle-password:hover {
            color: #f8fafc;
        }

        /* Seletor de Cargos (Radio Cards) */
        .roles-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 576px) {
            .roles-grid {
                grid-template-columns: 1fr;
            }
        }

        .role-card-option {
            position: relative;
            cursor: pointer;
        }

        .role-card-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .role-card-content {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1rem 0.75rem;
            text-align: center;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .role-card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            color: #94a3b8;
            margin-bottom: 0.6rem;
            transition: all 0.25s ease;
        }

        .role-card-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 0.2rem;
        }

        .role-card-desc {
            font-size: 0.72rem;
            color: #64748b;
            line-height: 1.25;
        }

        /* Estado Selecionado */
        .role-card-option input[type="radio"]:checked + .role-card-content {
            background: rgba(234, 88, 12, 0.12);
            border-color: #f97316;
            box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.3), 0 8px 20px -6px rgba(234, 88, 12, 0.25);
            transform: translateY(-2px);
        }

        .role-card-option input[type="radio"]:checked + .role-card-content .role-card-icon {
            background: var(--brand-gradient);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.35);
        }

        .role-card-option input[type="radio"]:checked + .role-card-content .role-card-title {
            color: #ffffff;
        }

        .role-card-option:hover .role-card-content {
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* Barra de Força da Senha */
        .password-strength-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .password-strength-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .password-hint {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.35rem;
            display: flex;
            justify-content: space-between;
        }

        /* Checkbox Customizado */
        .form-check-custom {
            display: flex;
            align-items: flex-start;
            gap: 0.65rem;
            margin-top: 1.25rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .form-check-custom input[type="checkbox"] {
            margin-top: 0.15rem;
            width: 1.15rem;
            height: 1.15rem;
            accent-color: #ea580c;
            border-radius: 4px;
            cursor: pointer;
        }

        .form-check-custom a {
            color: #fb923c;
            text-decoration: none;
            font-weight: 600;
        }

        .form-check-custom a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            background: var(--brand-gradient);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            padding: 0.95rem 1.5rem;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px var(--brand-glow);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(234, 88, 12, 0.5);
            color: #ffffff;
        }

        .custom-alert {
            border-radius: 12px;
            padding: 0.85rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.65rem;
            margin-bottom: 1.5rem;
            border: 1px solid transparent;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-error-custom {
            background: rgba(225, 29, 72, 0.12);
            border-color: rgba(225, 29, 72, 0.35);
            color: #fca5a5;
        }

        .signin-prompt {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 1rem;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .signin-prompt a {
            color: #fb923c;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease, text-decoration 0.2s ease;
        }

        .signin-prompt a:hover {
            color: #fdba74;
            text-decoration: underline;
        }

        .footer-legal {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.775rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="ambient-glow" style="top: 5%; left: 5%;"></div>
    <div class="ambient-glow" style="bottom: 5%; right: 5%;"></div>

    <main class="signup-wrapper">
        <div class="signup-card">
            
            <!-- Badge Superior -->
            <div class="text-center">
                <div class="brand-badge">
                    <i class="bi bi-person-plus-fill"></i> Cadastro de Integrante
                </div>

                <h1 class="brand-title">
                    Criar Nova <span class="accent">Conta</span>
                </h1>
                <p class="brand-subtitle">
                    Cadastre suas credenciais e escolha seu cargo operacional
                </p>
            </div>

            <!-- Feedback de Erro -->
            <div th:if="${erro}" class="custom-alert alert-error-custom" role="alert">
                <i class="bi bi-exclamation-octagon-fill fs-5"></i>
                <div th:text="${erro}"></div>
            </div>

            <!-- Formulário de Cadastro -->
            <form th:action="@{/cadastro}" method="post" id="signupForm" novalidate>
                
                <!-- Token CSRF -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <!-- E-mail -->
                <div class="mb-3">
                    <label for="email" class="form-label-custom">
                        <span><i class="bi bi-envelope-fill me-1"></i> E-mail Corporativo ou Pessoal</span>
                    </label>
                    <div class="input-group-custom">
                        <i class="bi bi-envelope input-icon-left"></i>
                        <input type="email" 
                               class="form-control-custom" 
                               id="email" 
                               name="email" 
                               th:value="${emailSalvo}"
                               placeholder="exemplo@pediupatrao.com.br" 
                               required 
                               autofocus
                               autocomplete="email">
                    </div>
                </div>

                <!-- Seleção de Cargo -->
                <div class="mb-3">
                    <label class="form-label-custom">
                        <span><i class="bi bi-briefcase-fill me-1"></i> Cargo / Função no Sistema</span>
                        <span class="text-muted small fw-normal">Selecione seu perfil</span>
                    </label>
                    
                    <div class="roles-grid">
                        <!-- Cargo: Atendente -->
                        <label class="role-card-option" title="Atendente de Balcão e Delivery">
                            <input type="radio" 
                                   name="role" 
                                   value="ATENDENTE" 
                                   th:checked="${roleSalva == null or roleSalva == 'ATENDENTE'}">
                            <div class="role-card-content">
                                <div class="role-card-icon">
                                    <i class="bi bi-headset"></i>
                                </div>
                                <div class="role-card-title">Atendente</div>
                                <div class="role-card-desc">Pedidos & Balcão</div>
                            </div>
                        </label>

                        <!-- Cargo: Gerente -->
                        <label class="role-card-option" title="Gerente da Pizzaria">
                            <input type="radio" 
                                   name="role" 
                                   value="GERENTE" 
                                   th:checked="${roleSalva == 'GERENTE'}">
                            <div class="role-card-content">
                                <div class="role-card-icon">
                                    <i class="bi bi-bar-chart-fill"></i>
                                </div>
                                <div class="role-card-title">Gerente</div>
                                <div class="role-card-desc">Dashboard & Gestão</div>
                            </div>
                        </label>

                        <!-- Cargo: Fornecedor -->
                        <label class="role-card-option" title="Fornecedor / Suprimentos">
                            <input type="radio" 
                                   name="role" 
                                   value="FORNECEDOR" 
                                   th:checked="${roleSalva == 'FORNECEDOR'}">
                            <div class="role-card-content">
                                <div class="role-card-icon">
                                    <i class="bi bi-box-seam-fill"></i>
                                </div>
                                <div class="role-card-title">Fornecedor</div>
                                <div class="role-card-desc">Estoque & Insumos</div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Senha -->
                <div class="mb-3">
                    <label for="password" class="form-label-custom">
                        <span><i class="bi bi-key-fill me-1"></i> Senha de Acesso</span>
                        <span class="text-muted small fw-normal" id="strengthText">Mínimo 6 caracteres</span>
                    </label>
                    <div class="input-group-custom">
                        <i class="bi bi-shield-lock-fill input-icon-left"></i>
                        <input type="password" 
                               class="form-control-custom" 
                               id="password" 
                               name="password" 
                               placeholder="Crie uma senha forte" 
                               required 
                               autocomplete="new-password"
                               style="padding-right: 2.85rem;">
                        <button type="button" 
                                class="btn-toggle-password" 
                                id="togglePasswordBtn" 
                                title="Mostrar ou ocultar senha"
                                aria-label="Mostrar ou ocultar senha">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                    <!-- Indicador de Força -->
                    <div class="password-strength-bar">
                        <div class="password-strength-fill" id="strengthFill"></div>
                    </div>
                </div>

                <!-- Confirmação de Senha -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label-custom">
                        <span><i class="bi bi-check2-circle me-1"></i> Confirmar Senha</span>
                        <span class="small" id="matchFeedback"></span>
                    </label>
                    <div class="input-group-custom">
                        <i class="bi bi-lock-fill input-icon-left"></i>
                        <input type="password" 
                               class="form-control-custom" 
                               id="confirmPassword" 
                               name="confirmPassword" 
                               placeholder="Repita a senha digitada" 
                               required 
                               autocomplete="new-password">
                    </div>
                </div>

                <!-- Termos e LGPD -->
                <div class="form-check-custom">
                    <input type="checkbox" 
                           id="consentimentoLgpd" 
                           name="consentimentoLgpd" 
                           value="true" 
                           required>
                    <label for="consentimentoLgpd">
                        Concordo com os <a th:href="@{/termos-de-uso}" target="_blank">Termos de Uso</a> e com a 
                        <a th:href="@{/politica-privacidade}" target="_blank">Política de Privacidade & LGPD</a> 
                        do sistema PediuPatrão.
                    </label>
                </div>

                <!-- Botão Criar Conta -->
                <button type="submit" class="btn-submit" id="btnSubmit">
                    <span>Criar Minha Conta</span>
                    <i class="bi bi-arrow-right-short fs-4"></i>
                </button>
            </form>

            <!-- Redirecionamento para Login -->
            <div class="signin-prompt">
                Já possui uma conta registrada? 
                <a th:href="@{/login}">Fazer login agora</a>
            </div>

            <!-- Rodapé -->
            <footer class="footer-legal">
                <div>&copy; 2026 PediuPatrão &bull; Sistema Integrado de Delivery</div>
            </footer>

        </div>
    </main>

    <!-- Scripts de Interação e Validação do Front -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Toggle de senha
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePasswordIcon');
            const confirmInput = document.getElementById('confirmPassword');
            const matchFeedback = document.getElementById('matchFeedback');
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');

            if (toggleBtn && passwordInput && toggleIcon) {
                toggleBtn.addEventListener('click', function () {
                    const isPassword = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                    toggleIcon.classList.toggle('bi-eye', !isPassword);
                    toggleIcon.classList.toggle('bi-eye-slash', isPassword);
                });
            }

            // Medidor de Força de Senha
            passwordInput.addEventListener('input', function () {
                const val = this.value;
                let score = 0;
                if (val.length >= 6) score += 25;
                if (val.length >= 8) score += 25;
                if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score += 25;
                if (/[0-9]/.test(val) || /[^A-Za-z0-9]/.test(val)) score += 25;

                strengthFill.style.width = score + '%';

                if (score === 0) {
                    strengthFill.style.backgroundColor = 'transparent';
                    strengthText.textContent = 'Mínimo 6 caracteres';
                    strengthText.style.color = '#64748b';
                } else if (score <= 25) {
                    strengthFill.style.backgroundColor = '#ef4444';
                    strengthText.textContent = 'Senha Fraca';
                    strengthText.style.color = '#f87171';
                } else if (score <= 75) {
                    strengthFill.style.backgroundColor = '#f59e0b';
                    strengthText.textContent = 'Senha Média';
                    strengthText.style.color = '#fbbf24';
                } else {
                    strengthFill.style.backgroundColor = '#10b981';
                    strengthText.textContent = 'Senha Forte';
                    strengthText.style.color = '#34d399';
                }

                checarMatch();
            });

            // Comparador de confirmação de senha
            confirmInput.addEventListener('input', checarMatch);

            function checarMatch() {
                const pass = passwordInput.value;
                const conf = confirmInput.value;

                if (!conf) {
                    matchFeedback.textContent = '';
                    return;
                }

                if (pass === conf) {
                    matchFeedback.textContent = 'Senhas coincidem ✓';
                    matchFeedback.style.color = '#34d399';
                } else {
                    matchFeedback.textContent = 'Senhas não coincidem ✗';
                    matchFeedback.style.color = '#f87171';
                }
            }

            // Validação no Envio
            document.getElementById('signupForm').addEventListener('submit', function (e) {
                const pass = passwordInput.value;
                const conf = confirmInput.value;
                const lgpd = document.getElementById('consentimentoLgpd').checked;

                if (pass.length < 6) {
                    e.preventDefault();
                    alert('A senha deve conter pelo menos 6 caracteres.');
                    passwordInput.focus();
                    return;
                }

                if (pass !== conf) {
                    e.preventDefault();
                    alert('As senhas digitadas não coincidem.');
                    confirmInput.focus();
                    return;
                }

                if (!lgpd) {
                    e.preventDefault();
                    alert('Você deve aceitar os Termos de Uso e Política de Privacidade para continuar.');
                }
            });
        });
    </script>
</body>
</html>
