<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pediu Patrão - Sistema de Pedidos</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="container-fluid mt-4">
            <div th:replace="~{__${content}__}"></div>
        </main>

        <!-- CSRF: envia o token do cookie XSRF-TOKEN em todas as chamadas fetch() -->
        <script th:inline="javascript">
            (function () {
                function lerCookie(nome) {
                    const p = document.cookie.split('; ').find(c => c.startsWith(nome + '='));
                    return p ? decodeURIComponent(p.substring(nome.length + 1)) : null;
                }
                const enviarFetch = window.fetch.bind(window);
                window.fetch = function (url, options) {
                    options = options || {};
                    const metodo = (options.method || 'GET').toUpperCase();
                    if (metodo !== 'GET' && metodo !== 'HEAD' && metodo !== 'OPTIONS') {
                        const token = lerCookie('XSRF-TOKEN');
                        if (token) {
                            options.headers = Object.assign({}, options.headers, { 'X-XSRF-TOKEN': token });
                        }
                    }
                    return enviarFetch(url, options);
                };
            })();
        </script>
        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
