<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes
        </h2>
        <a href="/clientes/novo" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <!-- Tabela de clientes -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientes-tabela">
                    <!-- Linhas carregadas via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = '/api/clientes';
        const tabelaClientes = document.getElementById('clientes-tabela');

        // Escapa valores antes de inserir em innerHTML (prevenção a XSS)
        function escapar(valor) {
            return String(valor ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatarEndereco(cliente) {
            const partes = [
                cliente.logradouro,
                cliente.numero,
                cliente.complemento,
                cliente.bairro,
                cliente.cidade,
                cliente.estado
            ].filter(p => p && p.trim() !== '');

            return partes.length > 0 ? partes.join(', ') : (cliente.endereco || '—');
        }

        async function carregarClientes() {
            const response = await fetch(API_URL);
            const clientes = await response.json();
            tabelaClientes.innerHTML = '';

            if (clientes.length === 0) {
                tabelaClientes.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum cliente cadastrado.
                        </td>
                    </tr>`;
                return;
            }

            clientes.forEach(cliente => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${escapar(cliente.nome) || '—'}</td>
                    <td>${escapar(cliente.telefone) || '—'}</td>
                    <td>${escapar(formatarEndereco(cliente))}</td>
                    <td class="text-end pe-4">
                        <a href="/clientes/editar/${cliente.id}" class="btn btn-sm btn-outline-primary me-1">
                            <i class="bi bi-pencil-fill"></i> Editar
                        </a>
                        <button class="btn btn-sm btn-outline-warning" onclick="excluirDadosPessoais('${cliente.id}')" title="Excluir ou anonimizar dados (LGPD)">
                            <i class="bi bi-shield-fill-exclamation"></i> LGPD
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="excluirCliente('${cliente.id}')">
                            <i class="bi bi-trash-fill"></i> Excluir
                        </button>
                    </td>
                `;
                tabelaClientes.appendChild(row);
            });
        }

        async function excluirCliente(id) {
            if (confirm('Tem certeza que deseja excluir este cliente?')) {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    alert('Cliente excluído com sucesso!');
                    carregarClientes();
                } else {
                    alert('Erro ao excluir o cliente.');
                }
            }
        }

        // LGPD: exclui os dados pessoais (anonimiza se houver pedidos vinculados)
        function excluirDadosPessoais(id) {
            if (confirm('Excluir/anonimizar os dados pessoais deste cliente (LGPD)?\n' +
                        'Se houver pedidos vinculados, apenas os dados serão anonimizados.')) {
                const token = document.cookie.split('; ')
                    .find(c => c.startsWith('XSRF-TOKEN='));
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = `/clientes/lgpd/excluir/${id}`;
                if (token) {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = '_csrf';
                    input.value = decodeURIComponent(token.substring('XSRF-TOKEN='.length));
                    form.appendChild(input);
                }
                document.body.appendChild(form);
                form.submit();
            }
        }

        carregarClientes();
    </script>
</div>
</body>
</html>
